<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAZE4 Arm Viewer</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2128;
    --panel2: #262a33;
    --border: #343a46;
    --text: #d6dae2;
    --muted: #8b93a3;
    --accent: #4ea1ff;
    --warn: #e0a145;
    --bad: #e05d5d;
    --good: #5dbb7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    display: flex;
  }
  #sidebar {
    width: 330px; min-width: 330px; height: 100%;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar h1 { font-size: 15px; padding: 10px 12px 6px; }
  #sidebar h1 small { color: var(--muted); font-weight: normal; font-size: 11px; }
  .section { padding: 8px 12px; border-top: 1px solid var(--border); }
  .section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-bottom: 6px;
  }
  .jrow { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .jrow label { width: 88px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jrow input[type=range] { flex: 1; accent-color: var(--accent); }
  .jrow .val { width: 48px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #live-status { color: var(--muted); font-size: 11px; margin-top: 5px; min-height: 14px; font-variant-numeric: tabular-nums; }
  #btn-live.active { background: #235c38; border-color: var(--good); }
  #ble-status { color: var(--muted); font-size: 11px; margin-top: 5px; min-height: 14px; }
  .mrow { border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; margin: 6px 0; }
  .mrow .mhead { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; margin-bottom: 2px; }
  .mrow .mstate { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mrow .btnrow { margin-top: 2px; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.active { background: #2c4a6b; border-color: var(--accent); }
  #tree { flex: 1; overflow-y: auto; padding: 6px 6px 10px; border-top: 1px solid var(--border); }
  .grp { margin-bottom: 4px; }
  .grp-head {
    display: flex; align-items: center; gap: 6px; padding: 4px 6px;
    background: var(--panel2); border-radius: 4px; cursor: pointer; user-select: none;
  }
  .grp-head .cnt { color: var(--muted); font-size: 11px; margin-left: auto; }
  .grp-head .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .grp-parts { display: none; padding: 2px 0 2px 14px; }
  .grp.open .grp-parts { display: block; }
  .part-row {
    display: flex; align-items: center; gap: 6px; padding: 1px 4px;
    border-radius: 3px; cursor: pointer; user-select: none;
  }
  .part-row:hover { background: #2a2f3a; }
  .part-row.selected { background: #35507022; outline: 1px solid var(--accent); }
  .part-row .pname { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .part-row .tag { font-size: 10px; padding: 0 4px; border-radius: 3px; margin-left: auto; }
  .tag.missing { background: var(--bad); color: #fff; }
  .tag.approx { color: var(--warn); }
  .tag.exact { color: var(--good); }
  .tag.good { color: var(--accent); }
  #info {
    border-top: 1px solid var(--border); padding: 8px 12px;
    max-height: 180px; overflow-y: auto; background: var(--panel2);
  }
  #info .iname { font-weight: 600; color: var(--accent); }
  #info .inotes { color: var(--muted); font-size: 12px; margin-top: 4px; }
  #viewport { flex: 1; position: relative; }
  #viewport canvas { display: block; }
  #status {
    position: absolute; top: 8px; left: 10px; color: var(--muted);
    font-size: 12px; pointer-events: none; text-shadow: 0 1px 2px #000;
  }
  input[type=checkbox] { accent-color: var(--accent); flex-shrink: 0; }
</style>
<script type="importmap">
  { "imports": { "three": "./lib/three.module.js" } }
</script>
</head>
<body>
  <div id="sidebar">
    <h1>FAZE4 Robot Arm <small>&mdash; assembly viewer</small></h1>
    <div class="section" id="motors-section">
      <h2>Motors</h2>
      <div class="btnrow">
        <button id="ble-connect" title="Direct Web Bluetooth link to the arm (Edge/Chrome)">Connect motors</button>
        <button id="ble-stopall" disabled>STOP ALL (space)</button>
        <button id="btn-twindrive" title="Joint sliders command the real motors: pose the twin, release, the motor nudges to match (dead reckoning until encoders)">&#128268; Slider drive</button>
      </div>
      <div id="ble-status">bluetooth: idle</div>
      <div id="motor-rows"></div>
    </div>
    <div class="section" id="joints-section">
      <h2>Joints</h2>
      <!-- joint sliders injected here -->
    </div>
    <div class="section">
      <h2>Explode</h2>
      <div class="jrow">
        <label for="explode">Explode</label>
        <input type="range" id="explode" min="0" max="1" step="0.01" value="0">
        <span class="val" id="explode-val">0.00</span>
      </div>
      <div class="btnrow">
        <button id="btn-reset">Reset pose</button>
        <button id="btn-explode">Explode 0/1</button>
        <button id="btn-wire">Wireframe</button>
        <button id="btn-skin" title="Semi-transparent URDF reference meshes (alignment aid)">Link skins</button>
        <button id="btn-rebuild" class="active" title="Swap in the MAD-motor rebuild parts; stock parts they replace hide">Rebuild parts</button>
        <button id="btn-live" title="Animate joints from real motor telemetry (needs tools/motor_gui.py running)">&#9679; Live</button>
      </div>
      <div id="live-status"></div>
    </div>
    <div id="tree"></div>
    <div id="info"><span class="iname">Nothing selected</span>
      <div class="inotes">Click a part in the 3D view or in the tree above.</div>
    </div>
  </div>
  <div id="viewport">
    <div id="status">Loading&hellip;</div>
  </div>
  <script type="module" src="./app.js?v=1786602433"></script>
</body>
</html>
